<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tama Speak — tableau de bord</title>
<link rel="icon" href="/icons/icon-192.png">
<!--
  Le tableau de bord admin.

  Pourquoi une page à part, en HTML nu, et pas un écran de l'app React :

    • elle ne pèse RIEN dans le bundle que téléchargent les élèves — un
      outil pour une personne n'a pas à voyager dans la poche de tout le
      monde ;
    • elle n'est pas pré-cachée par le service worker (voir vite.config.js,
      globIgnores) : on veut toujours les chiffres du jour, jamais ceux
      d'avant-hier ressortis du cache ;
    • sans build, sans dépendance : elle se corrige à la main, en direct.

  LA SÉCURITÉ N'EST PAS ICI. Cette page ne fait qu'afficher ce que le
  serveur veut bien lui donner ; c'est `api/admin.js` qui vérifie que
  l'email de la session figure dans ADMIN_EMAILS, et répond 403 sinon.
  Rien de sensible n'est décidé dans ce fichier — il est public, et ce
  n'est pas un problème.
-->
<style>
  :root {
    --turquoise: #10C4A8; --turquoise-deep: #0a7a69; --coral: #FF6F61;
    --cream: #FDF8EF; --sand: #FFFAF1; --sand-2: #F2EADC;
    --ink: #1E2530; --ink-soft: #5C6672; --line: #E8E0D2;
    --vert: #3CC26B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sand); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 40px; height: 40px; border-radius: 11px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  header .sous { font-size: 12px; color: var(--ink-soft); }

  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  nav button {
    border: 1px solid var(--line); background: var(--cream); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }
  nav button[aria-selected="true"] { background: var(--turquoise); border-color: var(--turquoise); color: #fff; }

  h2 { font-size: 11px; font-weight: 800; text-transform: uppercase;
       letter-spacing: .14em; color: var(--ink-soft); margin: 28px 0 10px; }
  h2:first-child { margin-top: 0; }

  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .carte { background: var(--cream); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .chiffre { font-size: 26px; font-weight: 800; letter-spacing: -.02em;
             color: var(--turquoise-deep); font-variant-numeric: tabular-nums; }
  .etiquette { font-size: 10.5px; font-weight: 800; text-transform: uppercase;
               letter-spacing: .06em; color: var(--ink-soft); margin-top: 2px; }
  .note { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  table { width: 100%; border-collapse: collapse; background: var(--cream);
          border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .defiler { overflow-x: auto; }

  .barre { height: 8px; background: var(--sand-2); border-radius: 999px; overflow: hidden; }
  .barre > i { display: block; height: 100%; background: var(--turquoise); border-radius: 999px; }

  .puce { display: inline-block; padding: 2px 8px; border-radius: 999px;
          font-size: 10.5px; font-weight: 800; }
  .puce.actif { background: rgba(60,194,107,.16); color: #227a45; }
  .puce.essai { background: rgba(16,196,168,.16); color: var(--turquoise-deep); }
  .puce.retard, .puce.annule { background: rgba(255,111,97,.16); color: #b0362b; }
  .puce.attente, .puce.aucun { background: var(--sand-2); color: var(--ink-soft); }

  .retour { background: var(--cream); border: 1px solid var(--line); border-radius: 16px;
            padding: 12px 14px; margin-bottom: 8px; }
  .retour .tete { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-soft); }
  .retour .msg { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
  .retour .actions { margin-top: 8px; display: flex; gap: 6px; }
  .retour .actions button {
    border: 1px solid var(--line); background: var(--sand); border-radius: 8px;
    padding: 4px 10px; font-size: 11px; font-weight: 800; cursor: pointer;
    color: var(--ink-soft); font-family: inherit;
  }
  .retour .actions button[disabled] { opacity: .45; cursor: default; }

  .message { background: var(--cream); border: 1px solid var(--line); border-radius: 16px;
             padding: 22px; text-align: center; color: var(--ink-soft); }
  .message b { color: var(--ink); }
  .muet { color: var(--ink-soft); font-size: 12px; }
  svg.courbe { width: 100%; height: 120px; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icons/icon-192.png" alt="">
    <div>
      <h1>Tableau de bord</h1>
      <div class="sous" id="sous">Chargement…</div>
    </div>
  </header>

  <nav id="onglets" role="tablist">
    <button role="tab" data-vue="usage" aria-selected="true">Usage</button>
    <button role="tab" data-vue="abonnements" aria-selected="false">Abonnements</button>
    <button role="tab" data-vue="retours" aria-selected="false">Retours</button>
  </nav>

  <main id="vue"><div class="message">· · ·</div></main>
</div>

<script type="module">
/* ------------------------------------------------------------------ */
/* Outils — pas de bibliothèque : `el()` fabrique les nœuds et met le  */
/* texte via textContent, jamais innerHTML. Les retours des            */
/* utilisateurs sont du texte libre : les injecter en HTML serait la   */
/* faille la plus bête qui soit, sur la page la plus privilégiée.      */
/* ------------------------------------------------------------------ */

const el = (tag, attrs = {}, ...enfants) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue
    if (k === 'class') n.className = v
    else if (k === 'style') n.style.cssText = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else n.setAttribute(k, v)
  }
  for (const c of enfants.flat()) {
    if (c === null || c === undefined || c === false) continue
    n.append(c instanceof Node ? c : document.createTextNode(String(c)))
  }
  return n
}

const vue = document.getElementById('vue')
const nombre = (n) => (n ?? 0).toLocaleString('fr-FR')
const pourcent = (a, b) => (b ? Math.round((a / b) * 100) : 0)
const jour = (d) => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })

async function api(route, options) {
  const r = await fetch(`/api/admin?r=${route}`, { credentials: 'include', ...options })
  if (r.status === 403) throw new Error('403')
  if (r.status === 503) throw new Error('503')
  if (!r.ok) throw new Error(String(r.status))
  return r.json()
}

const carte = (valeur, etiquette, note) =>
  el('div', { class: 'carte' },
    el('div', { class: 'chiffre' }, nombre(valeur)),
    el('div', { class: 'etiquette' }, etiquette),
    note ? el('div', { class: 'note' }, note) : null)

/** Histogramme d'activité — SVG à la main, 30 barres, sans dépendance. */
function courbe(points) {
  if (!points?.length) return el('p', { class: 'muet' }, 'Pas encore d’activité.')
  const max = Math.max(...points.map((p) => p.actifs), 1)
  const L = 100 / points.length
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('class', 'courbe')
  svg.setAttribute('viewBox', '0 0 100 40')
  svg.setAttribute('preserveAspectRatio', 'none')
  points.forEach((p, i) => {
    const h = (p.actifs / max) * 36
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
    r.setAttribute('x', (i * L + L * 0.15).toFixed(2))
    r.setAttribute('y', (38 - h).toFixed(2))
    r.setAttribute('width', (L * 0.7).toFixed(2))
    r.setAttribute('height', Math.max(h, 0.4).toFixed(2))
    r.setAttribute('rx', '0.5')
    r.setAttribute('fill', 'var(--turquoise)')
    r.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'),
      { textContent: `${jour(p.jour)} — ${p.actifs} actifs, ${p.evenements} événements` }))
    svg.append(r)
  })
  return el('div', {},
    svg,
    el('div', { class: 'note', style: 'display:flex;justify-content:space-between' },
      el('span', {}, jour(points[0].jour)),
      el('span', {}, `max ${max} actifs/jour`),
      el('span', {}, jour(points[points.length - 1].jour))))
}

/** Une ligne de rétention : « parmi les inscrits d'il y a N jours… ». */
function retention(label, base, revenus) {
  const p = pourcent(revenus, base)
  return el('div', { style: 'margin-bottom:10px' },
    el('div', { style: 'display:flex;justify-content:space-between;font-size:12px;font-weight:700' },
      el('span', {}, label),
      el('span', {}, base ? `${p} % — ${nombre(revenus)}/${nombre(base)}` : 'pas encore de recul')),
    el('div', { class: 'barre', style: 'margin-top:4px' },
      el('i', { style: `width:${p}%` })))
}

/* ------------------------------------------------------------------ */
/* Vue « Usage »                                                        */
/* ------------------------------------------------------------------ */

const LANGUES = { kab: 'Kabyle', rif: 'Tarifit', shi: 'Tachelhit', tzm: 'Tamazight (Atlas)', zgh: 'Amazighe standard' }

async function vueUsage() {
  const d = await api('stats')
  const r = d.retention || {}
  const totalLecons = (d.parLangue || []).reduce((s, l) => s + l.lecons, 0)

  return [
    el('h2', {}, 'Le monde de Tama Speak'),
    el('div', { class: 'grille' },
      carte(d.inscrits, 'Inscrits'),
      carte(d.actifs?.j1, 'Actifs aujourd’hui'),
      carte(d.actifs?.j7, 'Actifs sur 7 jours'),
      carte(d.actifs?.j30, 'Actifs sur 30 jours')),

    el('h2', {}, 'Activité, 30 derniers jours'),
    el('div', { class: 'carte' }, courbe(d.courbe)),

    el('h2', {}, 'Rétention par cohorte'),
    el('div', { class: 'carte' },
      retention('Revenus après J+1', r.base_j1, r.revenus_j1),
      retention('Revenus après J+7', r.base_j7, r.revenus_j7),
      retention('Revenus après J+30', r.base_j30, r.revenus_j30),
      el('div', { class: 'note' },
        'Parmi les personnes inscrites il y a au moins N jours, celles qui sont revenues APRÈS ce délai. ' +
        'C’est la seule mesure qui dise si l’app sert vraiment à quelqu’un.')),

    el('h2', {}, `Leçons terminées — ${nombre(totalLecons)} en tout`),
    (d.parLangue || []).length
      ? el('div', { class: 'defiler' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Cours'), el('th', {}, 'Part'), el('th', { class: 'n' }, 'Leçons'))),
          el('tbody', {}, (d.parLangue || []).map((l) =>
            el('tr', {},
              el('td', {}, LANGUES[l.lang] || l.lang),
              el('td', { style: 'width:50%' },
                el('div', { class: 'barre' }, el('i', { style: `width:${pourcent(l.lecons, totalLecons)}%` }))),
              el('td', { class: 'n' }, nombre(l.lecons)))))))
      : el('p', { class: 'muet' }, 'Aucune leçon terminée pour l’instant.'),

    el('h2', {}, 'Dernières inscriptions'),
    (d.derniers || []).length
      ? el('div', { class: 'defiler' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Nom'), el('th', {}, 'Email'), el('th', {}, 'Le'))),
          el('tbody', {}, d.derniers.map((u) =>
            el('tr', {},
              el('td', {}, u.name || '—'),
              el('td', {}, u.email),
              el('td', {}, new Date(u.createdAt).toLocaleDateString('fr-FR')))))))
      : el('p', { class: 'muet' }, 'Personne encore.'),
  ]
}

/* ------------------------------------------------------------------ */
/* Vue « Abonnements »                                                  */
/* ------------------------------------------------------------------ */

const PLANS = { solo: 'Une personne', famille: 'Famille (4)' }
const ZONES = { nord: 'Europe & Amériques', sud: 'Afrique & Asie' }

async function vueAbonnements() {
  const d = await api('revenus')
  const a = d.actifs || {}
  const f = d.famille || {}
  const lignes = (d.parStatut || []).filter((l) => l.statut !== 'aucun')

  return [
    el('h2', {}, 'Abonnements ouverts'),
    el('div', { class: 'grille' },
      carte(a.ouverts, 'Actifs + essais'),
      carte(a.essais, 'En période d’essai'),
      carte(a.retards, 'Paiement en retard', 'Accès maintenu jusqu’au terme payé'),
      carte(a.partants, 'Résiliés à échéance')),

    el('h2', {}, 'Le détail'),
    lignes.length
      ? el('div', { class: 'defiler' }, el('table', {},
          el('thead', {}, el('tr', {},
            el('th', {}, 'Statut'), el('th', {}, 'Formule'), el('th', {}, 'Zone'), el('th', { class: 'n' }, 'Personnes'))),
          el('tbody', {}, lignes.map((l) =>
            el('tr', {},
              el('td', {}, el('span', { class: `puce ${l.statut}` }, l.statut)),
              el('td', {}, PLANS[l.plan] || l.plan || '—'),
              el('td', {}, ZONES[l.zone] || l.zone || '—'),
              el('td', { class: 'n' }, nombre(l.n)))))))
      : el('p', { class: 'muet' }, 'Aucun abonnement pour l’instant.'),

    el('h2', {}, 'Packs famille'),
    el('div', { class: 'grille' },
      carte(f.packs, 'Packs souscrits'),
      carte(f.places_prises, 'Places occupées', 'Proches réellement venus'),
      carte(f.invitations_dormantes, 'Invitations en attente', 'Codes créés, jamais ouverts')),

    el('h2', {}, 'Nouveaux abonnés, 30 derniers jours'),
    el('div', { class: 'carte' },
      courbe((d.nouveaux || []).map((n) => ({ jour: n.jour, actifs: n.n, evenements: n.n })))),

    el('div', { class: 'note', style: 'margin-top:16px' },
      'Volontairement en NOMBRE de personnes, pas en euros : les montants réels — remises, TVA, ' +
      'impayés, remboursements — vivent chez Stripe, qui les calcule mieux. Pour le chiffre ' +
      'd’affaires, c’est le tableau de bord Stripe qui fait foi.'),
  ]
}

/* ------------------------------------------------------------------ */
/* Vue « Retours »                                                      */
/* ------------------------------------------------------------------ */

const HUMEURS = { love: '😍', good: '🙂', meh: '😐', bad: '😕' }
const SUIVANT = { nouveau: 'vu', vu: 'traite', traite: null }

async function vueRetours() {
  const d = await api('feedbacks')
  const liste = d.feedbacks || []
  if (!liste.length) return [el('p', { class: 'muet' }, 'Aucun retour pour l’instant.')]

  const bloc = (f) => {
    const n = el('div', { class: 'retour' })
    const rendre = () => {
      n.textContent = ''
      const suite = SUIVANT[f.status]
      n.append(
        el('div', { class: 'tete' },
          el('span', { style: 'font-size:17px' }, HUMEURS[f.mood] || '•'),
          el('span', { class: `puce ${f.status === 'traite' ? 'actif' : f.status === 'vu' ? 'essai' : 'attente'}` }, f.status),
          f.category ? el('span', {}, f.category) : null,
          f.lang ? el('span', {}, LANGUES[f.lang] || f.lang) : null,
          el('span', {}, new Date(f.created_at).toLocaleString('fr-FR')),
          f.email ? el('span', {}, f.email) : el('span', {}, 'anonyme')),
        f.message ? el('p', { class: 'msg' }, f.message) : el('p', { class: 'msg muet' }, '(emoji seul, sans texte)'),
        el('div', { class: 'actions' },
          el('button', {
            disabled: !suite,
            onclick: async () => {
              if (!suite) return
              await api('feedbacks', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: Number(f.id), status: suite }),
              })
              f.status = suite
              rendre()
            },
          }, suite === 'vu' ? 'Marquer vu' : suite === 'traite' ? 'Marquer traité' : 'Traité ✓')),
      )
    }
    rendre()
    return n
  }

  const parStatut = (s) => liste.filter((f) => f.status === s)
  return [
    el('h2', {}, `À traiter — ${parStatut('nouveau').length}`),
    ...(parStatut('nouveau').length ? parStatut('nouveau').map(bloc) : [el('p', { class: 'muet' }, 'Rien en attente. 🎉')]),
    el('h2', {}, `Vus — ${parStatut('vu').length}`),
    ...parStatut('vu').map(bloc),
    el('h2', {}, `Traités — ${parStatut('traite').length}`),
    ...parStatut('traite').map(bloc),
  ]
}

/* ------------------------------------------------------------------ */
/* Aiguillage                                                           */
/* ------------------------------------------------------------------ */

const VUES = { usage: vueUsage, abonnements: vueAbonnements, retours: vueRetours }

async function afficher(nom) {
  for (const b of document.querySelectorAll('#onglets button')) {
    b.setAttribute('aria-selected', String(b.dataset.vue === nom))
  }
  vue.textContent = ''
  vue.append(el('div', { class: 'message' }, '· · ·'))
  try {
    const contenu = await VUES[nom]()
    vue.textContent = ''
    vue.append(...contenu.flat().filter(Boolean))
    document.getElementById('sous').textContent =
      `Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`
  } catch (e) {
    vue.textContent = ''
    // Chaque refus dit ce qu'il faut FAIRE : un « 403 » nu n'aide personne.
    vue.append(el('div', { class: 'message' },
      e.message === '403'
        ? el('span', {}, el('b', {}, 'Accès refusé.'), ' ',
            'Connecte-toi à Tama Speak avec un email figurant dans la variable ADMIN_EMAILS, ',
            'puis recharge cette page.')
        : e.message === '503'
          ? el('span', {}, el('b', {}, 'Base de données non configurée.'), ' ',
              'DATABASE_URL n’est pas renseignée : l’app tourne en mode local, il n’y a rien à mesurer.')
          : el('span', {}, el('b', {}, 'Le serveur n’a pas répondu.'), ' Réessaie dans un instant.')))
  }
}

document.getElementById('onglets').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-vue]')
  if (b) afficher(b.dataset.vue)
})

afficher('usage')
</script>
</body>
</html>
