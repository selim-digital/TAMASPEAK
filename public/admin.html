<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tama Speak — tableau de bord</title>
<link rel="icon" href="/icons/icon-192.png">
<!--
  Le tableau de bord admin.

  Pourquoi une page à part, en HTML nu, et pas un écran de l'app React :

    • elle ne pèse RIEN dans le bundle que téléchargent les élèves — un
      outil pour une personne n'a pas à voyager dans la poche de tout le
      monde ;
    • elle n'est pas pré-cachée par le service worker (voir vite.config.js,
      globIgnores) : on veut toujours les chiffres du jour, jamais ceux
      d'avant-hier ressortis du cache ;
    • sans build, sans dépendance : elle se corrige à la main, en direct.

  LA SÉCURITÉ N'EST PAS ICI. Cette page ne fait qu'afficher ce que le
  serveur veut bien lui donner ; c'est `api/admin.js` qui vérifie que
  l'email de la session figure dans ADMIN_EMAILS, et répond 403 sinon.
  Rien de sensible n'est décidé dans ce fichier — il est public, et ce
  n'est pas un problème.
-->
<style>
  :root {
    --turquoise: #10C4A8; --turquoise-deep: #0a7a69; --coral: #FF6F61;
    --cream: #FDF8EF; --sand: #FFFAF1; --sand-2: #F2EADC;
    --ink: #1E2530; --ink-soft: #5C6672; --line: #E8E0D2;
    --vert: #3CC26B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sand); color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header img { width: 40px; height: 40px; border-radius: 11px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  header .sous { font-size: 12px; color: var(--ink-soft); }

  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  nav button {
    border: 1px solid var(--line); background: var(--cream); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }
  nav button[aria-selected="true"] { background: var(--turquoise); border-color: var(--turquoise); color: #fff; }

  h2 { font-size: 11px; font-weight: 800; text-transform: uppercase;
       letter-spacing: .14em; color: var(--ink-soft); margin: 28px 0 10px; }
  h2:first-child { margin-top: 0; }

  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .carte { background: var(--cream); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .chiffre { font-size: 26px; font-weight: 800; letter-spacing: -.02em;
             color: var(--turquoise-deep); font-variant-numeric: tabular-nums; }
  .etiquette { font-size: 10.5px; font-weight: 800; text-transform: uppercase;
               letter-spacing: .06em; color: var(--ink-soft); margin-top: 2px; }
  .note { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  table { width: 100%; border-collapse: collapse; background: var(--cream);
          border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .defiler { overflow-x: auto; }

  .barre { height: 8px; background: var(--sand-2); border-radius: 999px; overflow: hidden; }
  .barre > i { display: block; height: 100%; background: var(--turquoise); border-radius: 999px; }

  .puce { display: inline-block; padding: 2px 8px; border-radius: 999px;
          font-size: 10.5px; font-weight: 800; }
  .puce.actif { background: rgba(60,194,107,.16); color: #227a45; }
  .puce.essai { background: rgba(16,196,168,.16); color: var(--turquoise-deep); }
  .puce.retard, .puce.annule { background: rgba(255,111,97,.16); color: #b0362b; }
  .puce.attente, .puce.aucun { background: var(--sand-2); color: var(--ink-soft); }

  .retour { background: var(--cream); border: 1px solid var(--line); border-radius: 16px;
            padding: 12px 14px; margin-bottom: 8px; }
  .retour .tete { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-soft); }
  .retour .msg { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
  .retour .actions { margin-top: 8px; display: flex; gap: 6px; }
  .retour .actions button {
    border: 1px solid var(--line); background: var(--sand); border-radius: 8px;
    padding: 4px 10px; font-size: 11px; font-weight: 800; cursor: pointer;
    color: var(--ink-soft); font-family: inherit;
  }
  .retour .actions button[disabled] { opacity: .45; cursor: default; }

  .message { background: var(--cream); border: 1px solid var(--line); border-radius: 16px;
             padding: 22px; text-align: center; color: var(--ink-soft); }
  .message b { color: var(--ink); }
  .muet { color: var(--ink-soft); font-size: 12px; }
  svg.courbe { width: 100%; height: 120px; display: block; }

  /* ---------------------------------------------------------------- */
  /* L'atelier du contenu — dictionnaire, validation, enregistrements. */
  /* Les tableaux y sont larges (sept colonnes éditables) : la page     */
  /* s'élargit sur ces vues-là seulement, pour ne pas changer la mise   */
  /* en page des chiffres, qui se lisent mieux serrés.                  */
  /* ---------------------------------------------------------------- */
  .wrap.large { max-width: 1360px; }

  .filtres { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filtres select, .filtres input {
    font-family: inherit; font-size: 13px; padding: 6px 10px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; background: var(--cream);
  }
  .filtres input[type="search"] { min-width: 190px; }
  .filtres .pousse { margin-left: auto; }

  .bouton {
    border: 1px solid var(--line); background: var(--cream); color: var(--ink-soft);
    border-radius: 9px; padding: 6px 12px; font-size: 12.5px; font-weight: 800;
    cursor: pointer; font-family: inherit; text-decoration: none; display: inline-block;
  }
  .bouton.fort { background: var(--turquoise); border-color: var(--turquoise); color: #fff; }
  .bouton.doux { background: var(--sand); }
  .bouton[disabled] { opacity: .45; cursor: default; }

  /* Édition en place : le champ ne se signale qu'au survol. Une grille de
     deux cents rectangles blancs serait illisible ; ici on lit d'abord le
     contenu, et l'outil apparaît quand la souris s'en approche. */
  td input, td select, td textarea {
    width: 100%; font-family: inherit; font-size: 13px; padding: 5px 7px; color: var(--ink);
    border: 1px solid transparent; border-radius: 7px; background: transparent;
  }
  td input:hover, td select:hover, td textarea:hover { border-color: var(--line); }
  td input:focus, td select:focus, td textarea:focus {
    border-color: var(--turquoise); background: var(--sand); outline: none;
  }
  td.kab input { font-weight: 800; font-size: 14.5px; }
  tr.enregistre > td { animation: flash 1.1s ease; }
  @keyframes flash { from { background: rgba(60,194,107,.28); } to { background: transparent; } }
  tr.rejete > td:not(.actions) { opacity: .5; }

  .puce.valide { background: rgba(60,194,107,.16); color: #227a45; }
  .puce.a-valider { background: var(--sand-2); color: var(--ink-soft); }
  .puce.a-revoir { background: rgba(240,180,41,.2); color: #8a6300; }
  .puce.rejete { background: rgba(255,111,97,.16); color: #b0362b; }
  .puce.cours, .puce.dictionnaire { background: rgba(16,196,168,.14); color: var(--turquoise-deep); }
  .puce.ajout { background: rgba(255,111,97,.14); color: #b0362b; }

  /* Les quatre voix — une cellule par voix, deux états : prise faite
     (verte, on écoute) ou prise à faire (on enregistre ou on dépose). */
  .voixcell { display: flex; gap: 3px; align-items: center; }
  .mini {
    border: 1px solid var(--line); background: var(--sand); color: var(--ink-soft);
    border-radius: 7px; min-width: 27px; height: 27px; display: grid; place-items: center;
    cursor: pointer; font-size: 12px; padding: 0 5px; font-family: inherit; text-decoration: none;
  }
  .mini.plein { background: rgba(60,194,107,.16); border-color: rgba(60,194,107,.45); color: #227a45; }
  .mini.rec { background: var(--coral); border-color: var(--coral); color: #fff; animation: pulse 1s infinite; }
  .mini[disabled] { opacity: .4; cursor: default; }
  @keyframes pulse { 50% { opacity: .5; } }
  .mini input[type="file"] { display: none; }

  /* Une entrée à valider — assez grande pour qu'on la lise vraiment. */
  .entree { background: var(--cream); border: 1px solid var(--line); border-radius: 16px;
            padding: 14px 16px; margin-bottom: 10px; }
  .entree .tete { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entree .mot { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .entree .champs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  @media (max-width: 720px) { .entree .champs { grid-template-columns: 1fr; } }
  .entree .champs label { font-size: 10.5px; font-weight: 800; text-transform: uppercase;
                          letter-spacing: .06em; color: var(--ink-soft); display: block; margin-bottom: 3px; }
  .entree .champs input {
    width: 100%; font-family: inherit; font-size: 14px; padding: 7px 9px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; background: var(--sand);
  }
  .entree .champs input:focus { border-color: var(--turquoise); outline: none; }
  .entree .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }

  .avert { background: rgba(255,111,97,.1); border: 1px solid rgba(255,111,97,.35);
           color: #b0362b; border-radius: 12px; padding: 10px 13px; font-size: 12.5px;
           margin-bottom: 12px; }
  .encart { background: var(--cream); border: 1px solid var(--line); border-radius: 16px;
            padding: 14px 16px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/icons/icon-192.png" alt="">
    <div>
      <h1>Tableau de bord</h1>
      <div class="sous" id="sous">Chargement…</div>
    </div>
  </header>

  <nav id="onglets" role="tablist">
    <button role="tab" data-vue="usage" aria-selected="true">Usage</button>
    <button role="tab" data-vue="abonnements" aria-selected="false">Abonnements</button>
    <button role="tab" data-vue="retours" aria-selected="false">Retours</button>
    <button role="tab" data-vue="enregistrements" aria-selected="false">Enregistrements</button>
    <button role="tab" data-vue="validation" aria-selected="false">À valider</button>
    <button role="tab" data-vue="dictionnaire" aria-selected="false">Dictionnaire</button>
  </nav>

  <main id="vue"><div class="message">· · ·</div></main>
</div>

<script type="module">
/* ------------------------------------------------------------------ */
/* Outils — pas de bibliothèque : `el()` fabrique les nœuds et met le  */
/* texte via textContent, jamais innerHTML. Les retours des            */
/* utilisateurs sont du texte libre : les injecter en HTML serait la   */
/* faille la plus bête qui soit, sur la page la plus privilégiée.      */
/* ------------------------------------------------------------------ */

const el = (tag, attrs = {}, ...enfants) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue
    if (k === 'class') n.className = v
    else if (k === 'style') n.style.cssText = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else n.setAttribute(k, v)
  }
  for (const c of enfants.flat()) {
    if (c === null || c === undefined || c === false) continue
    n.append(c instanceof Node ? c : document.createTextNode(String(c)))
  }
  return n
}

const vue = document.getElementById('vue')
const nombre = (n) => (n ?? 0).toLocaleString('fr-FR')
const pourcent = (a, b) => (b ? Math.round((a / b) * 100) : 0)
const jour = (d) => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' })

/** L'adresse d'une route du tableau de bord, avec ses paramètres. */
function adresse(route, params) {
  const u = new URL('/api/admin', location.origin)
  u.searchParams.set('r', route)
  for (const [k, v] of Object.entries(params || {})) if (v) u.searchParams.set(k, v)
  return u
}

async function api(route, { params, ...options } = {}) {
  const r = await fetch(adresse(route, params), { credentials: 'include', ...options })
  if (r.status === 403) throw new Error('403')
  if (r.status === 503) throw new Error('503')
  if (!r.ok) {
    // Le serveur explique ses refus (« entrée venue du contenu », « format non
    // accepté ») : les remplacer par un numéro perdrait ce qui aide à agir.
    let quoi = String(r.status)
    try {
      const j = await r.json()
      quoi = [j.error, j.detail].filter(Boolean).join(' — ') || quoi
    } catch {
      /* réponse non JSON : le numéro fera l'affaire */
    }
    throw new Error(quoi)
  }
  return r.json()
}

/** Écriture JSON (POST/PATCH) — le corps est toujours du JSON ici. */
const ecrire = (route, method, corps, params) =>
  api(route, {
    method,
    params,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(corps),
  })

const carte = (valeur, etiquette, note) =>
  el('div', { class: 'carte' },
    el('div', { class: 'chiffre' }, nombre(valeur)),
    el('div', { class: 'etiquette' }, etiquette),
    note ? el('div', { class: 'note' }, note) : null)

/** Histogramme d'activité — SVG à la main, 30 barres, sans dépendance. */
function courbe(points) {
  if (!points?.length) return el('p', { class: 'muet' }, 'Pas encore d’activité.')
  const max = Math.max(...points.map((p) => p.actifs), 1)
  const L = 100 / points.length
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('class', 'courbe')
  svg.setAttribute('viewBox', '0 0 100 40')
  svg.setAttribute('preserveAspectRatio', 'none')
  points.forEach((p, i) => {
    const h = (p.actifs / max) * 36
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
    r.setAttribute('x', (i * L + L * 0.15).toFixed(2))
    r.setAttribute('y', (38 - h).toFixed(2))
    r.setAttribute('width', (L * 0.7).toFixed(2))
    r.setAttribute('height', Math.max(h, 0.4).toFixed(2))
    r.setAttribute('rx', '0.5')
    r.setAttribute('fill', 'var(--turquoise)')
    r.append(Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'title'),
      { textContent: `${jour(p.jour)} — ${p.actifs} actifs, ${p.evenements} événements` }))
    svg.append(r)
  })
  return el('div', {},
    svg,
    el('div', { class: 'note', style: 'display:flex;justify-content:space-between' },
      el('span', {}, jour(points[0].jour)),
      el('span', {}, `max ${max} actifs/jour`),
      el('span', {}, jour(points[points.length - 1].jour))))
}

/** Une ligne de rétention : « parmi les inscrits d'il y a N jours… ». */
function retention(label, base, revenus) {
  const p = pourcent(revenus, base)
  return el('div', { style: 'margin-bottom:10px' },
    el('div', { style: 'display:flex;justify-content:space-between;font-size:12px;font-weight:700' },
      el('span', {}, label),
      el('span', {}, base ? `${p} % — ${nombre(revenus)}/${nombre(base)}` : 'pas encore de recul')),
    el('div', { class: 'barre', style: 'margin-top:4px' },
      el('i', { style: `width:${p}%` })))
}

/* ------------------------------------------------------------------ */
/* Vue « Usage »                                                        */
/* ------------------------------------------------------------------ */

const LANGUES = { kab: 'Kabyle', rif: 'Tarifit', shi: 'Tachelhit', tzm: 'Tamazight (Atlas)', zgh: 'Amazighe standard' }

async function vueUsage() {
  const d = await api('stats')
  const r = d.retention || {}
  const totalLecons = (d.parLangue || []).reduce((s, l) => s + l.lecons, 0)

  return [
    el('h2', {}, 'Le monde de Tama Speak'),
    el('div', { class: 'grille' },
      carte(d.inscrits, 'Inscrits'),
      carte(d.actifs?.j1, 'Actifs aujourd’hui'),
      carte(d.actifs?.j7, 'Actifs sur 7 jours'),
      carte(d.actifs?.j30, 'Actifs sur 30 jours')),

    el('h2', {}, 'Activité, 30 derniers jours'),
    el('div', { class: 'carte' }, courbe(d.courbe)),

    el('h2', {}, 'Rétention par cohorte'),
    el('div', { class: 'carte' },
      retention('Revenus après J+1', r.base_j1, r.revenus_j1),
      retention('Revenus après J+7', r.base_j7, r.revenus_j7),
      retention('Revenus après J+30', r.base_j30, r.revenus_j30),
      el('div', { class: 'note' },
        'Parmi les personnes inscrites il y a au moins N jours, celles qui sont revenues APRÈS ce délai. ' +
        'C’est la seule mesure qui dise si l’app sert vraiment à quelqu’un.')),

    el('h2', {}, `Leçons terminées — ${nombre(totalLecons)} en tout`),
    (d.parLangue || []).length
      ? el('div', { class: 'defiler' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Cours'), el('th', {}, 'Part'), el('th', { class: 'n' }, 'Leçons'))),
          el('tbody', {}, (d.parLangue || []).map((l) =>
            el('tr', {},
              el('td', {}, LANGUES[l.lang] || l.lang),
              el('td', { style: 'width:50%' },
                el('div', { class: 'barre' }, el('i', { style: `width:${pourcent(l.lecons, totalLecons)}%` }))),
              el('td', { class: 'n' }, nombre(l.lecons)))))))
      : el('p', { class: 'muet' }, 'Aucune leçon terminée pour l’instant.'),

    el('h2', {}, 'Dernières inscriptions'),
    (d.derniers || []).length
      ? el('div', { class: 'defiler' }, el('table', {},
          el('thead', {}, el('tr', {}, el('th', {}, 'Nom'), el('th', {}, 'Email'), el('th', {}, 'Le'))),
          el('tbody', {}, d.derniers.map((u) =>
            el('tr', {},
              el('td', {}, u.name || '—'),
              el('td', {}, u.email),
              el('td', {}, new Date(u.createdAt).toLocaleDateString('fr-FR')))))))
      : el('p', { class: 'muet' }, 'Personne encore.'),
  ]
}

/* ------------------------------------------------------------------ */
/* Vue « Abonnements »                                                  */
/* ------------------------------------------------------------------ */

const PLANS = { solo: 'Une personne', famille: 'Famille (4)' }
const ZONES = { nord: 'Europe & Amériques', sud: 'Afrique & Asie' }

async function vueAbonnements() {
  const d = await api('revenus')
  const a = d.actifs || {}
  const f = d.famille || {}
  const lignes = (d.parStatut || []).filter((l) => l.statut !== 'aucun')

  return [
    el('h2', {}, 'Abonnements ouverts'),
    el('div', { class: 'grille' },
      carte(a.ouverts, 'Actifs + essais'),
      carte(a.essais, 'En période d’essai'),
      carte(a.retards, 'Paiement en retard', 'Accès maintenu jusqu’au terme payé'),
      carte(a.partants, 'Résiliés à échéance')),

    el('h2', {}, 'Le détail'),
    lignes.length
      ? el('div', { class: 'defiler' }, el('table', {},
          el('thead', {}, el('tr', {},
            el('th', {}, 'Statut'), el('th', {}, 'Formule'), el('th', {}, 'Zone'), el('th', { class: 'n' }, 'Personnes'))),
          el('tbody', {}, lignes.map((l) =>
            el('tr', {},
              el('td', {}, el('span', { class: `puce ${l.statut}` }, l.statut)),
              el('td', {}, PLANS[l.plan] || l.plan || '—'),
              el('td', {}, ZONES[l.zone] || l.zone || '—'),
              el('td', { class: 'n' }, nombre(l.n)))))))
      : el('p', { class: 'muet' }, 'Aucun abonnement pour l’instant.'),

    el('h2', {}, 'Packs famille'),
    el('div', { class: 'grille' },
      carte(f.packs, 'Packs souscrits'),
      carte(f.places_prises, 'Places occupées', 'Proches réellement venus'),
      carte(f.invitations_dormantes, 'Invitations en attente', 'Codes créés, jamais ouverts')),

    el('h2', {}, 'Nouveaux abonnés, 30 derniers jours'),
    el('div', { class: 'carte' },
      courbe((d.nouveaux || []).map((n) => ({ jour: n.jour, actifs: n.n, evenements: n.n })))),

    el('div', { class: 'note', style: 'margin-top:16px' },
      'Volontairement en NOMBRE de personnes, pas en euros : les montants réels — remises, TVA, ' +
      'impayés, remboursements — vivent chez Stripe, qui les calcule mieux. Pour le chiffre ' +
      'd’affaires, c’est le tableau de bord Stripe qui fait foi.'),
  ]
}

/* ------------------------------------------------------------------ */
/* Vue « Retours »                                                      */
/* ------------------------------------------------------------------ */

const HUMEURS = { love: '😍', good: '🙂', meh: '😐', bad: '😕' }
const SUIVANT = { nouveau: 'vu', vu: 'traite', traite: null }

async function vueRetours() {
  const d = await api('feedbacks')
  const liste = d.feedbacks || []
  if (!liste.length) return [el('p', { class: 'muet' }, 'Aucun retour pour l’instant.')]

  const bloc = (f) => {
    const n = el('div', { class: 'retour' })
    const rendre = () => {
      n.textContent = ''
      const suite = SUIVANT[f.status]
      n.append(
        el('div', { class: 'tete' },
          el('span', { style: 'font-size:17px' }, HUMEURS[f.mood] || '•'),
          el('span', { class: `puce ${f.status === 'traite' ? 'actif' : f.status === 'vu' ? 'essai' : 'attente'}` }, f.status),
          f.category ? el('span', {}, f.category) : null,
          f.lang ? el('span', {}, LANGUES[f.lang] || f.lang) : null,
          el('span', {}, new Date(f.created_at).toLocaleString('fr-FR')),
          f.email ? el('span', {}, f.email) : el('span', {}, 'anonyme')),
        f.message ? el('p', { class: 'msg' }, f.message) : el('p', { class: 'msg muet' }, '(emoji seul, sans texte)'),
        el('div', { class: 'actions' },
          el('button', {
            disabled: !suite,
            onclick: async () => {
              if (!suite) return
              await api('feedbacks', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: Number(f.id), status: suite }),
              })
              f.status = suite
              rendre()
            },
          }, suite === 'vu' ? 'Marquer vu' : suite === 'traite' ? 'Marquer traité' : 'Traité ✓')),
      )
    }
    rendre()
    return n
  }

  const parStatut = (s) => liste.filter((f) => f.status === s)
  return [
    el('h2', {}, `À traiter — ${parStatut('nouveau').length}`),
    ...(parStatut('nouveau').length ? parStatut('nouveau').map(bloc) : [el('p', { class: 'muet' }, 'Rien en attente. 🎉')]),
    el('h2', {}, `Vus — ${parStatut('vu').length}`),
    ...parStatut('vu').map(bloc),
    el('h2', {}, `Traités — ${parStatut('traite').length}`),
    ...parStatut('traite').map(bloc),
  ]
}

/* ------------------------------------------------------------------ */
/* L'ATELIER DU CONTENU                                                 */
/*                                                                      */
/* Trois onglets, UNE seule liste derrière : ce sont trois regards sur   */
/* le même contenu, pas trois contenus.                                 */
/*   • Enregistrements — ce qu'il reste à dire, voix par voix ;         */
/*   • À valider       — ce que personne n'a encore relu ;              */
/*   • Dictionnaire    — tout, et tout modifiable.                      */
/*                                                                      */
/* Le contenu vient de `src/data/` (dictionnaire, ou vocabulaire des    */
/* cours à défaut) et y retourne : ce qu'on corrige ici doit être        */
/* reporté dans les fichiers du cours pour atteindre les téléphones.     */
/* La colonne « du cours » montre l'écart tant que ce n'est pas fait.    */
/* ------------------------------------------------------------------ */

const VOIX = [
  { id: 'femme', label: 'Femme', court: 'Fem' },
  { id: 'homme', label: 'Homme', court: 'Hom' },
  { id: 'fille', label: 'Enfant fille', court: 'Fille' },
  { id: 'garcon', label: 'Enfant garçon', court: 'Garçon' },
]

const STATUTS = {
  'a-valider': 'à valider',
  valide: 'validé',
  'a-revoir': 'à revoir',
  rejete: 'rejeté',
}

const CATEGORIES = { mot: 'mot', expression: 'expression', lettre: 'lettre' }

/** Extension de fichier par format — pour que le téléchargement s'ouvre. */
const EXT = {
  'audio/webm': 'webm', 'audio/webm;codecs=opus': 'webm',
  'audio/ogg': 'ogg', 'audio/ogg;codecs=opus': 'ogg',
  'audio/mp4': 'm4a', 'audio/x-m4a': 'm4a', 'audio/mpeg': 'mp3',
  'audio/aac': 'aac', 'audio/wav': 'wav', 'audio/x-wav': 'wav',
}

/** Un fichier reçu par messagerie n'annonce pas toujours son type. */
const TYPE_PAR_EXT = {
  mp3: 'audio/mpeg', m4a: 'audio/mp4', mp4: 'audio/mp4', aac: 'audio/aac',
  wav: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', webm: 'audio/webm',
}

/** ~600 Ko binaires — le plafond du serveur, en clair pour l'utilisateur. */
const TAILLE_MAX = 590_000

const LEX = {
  lang: '',
  statut: '',
  categorie: '',
  manque: '',
  q: '',
  vue: null, // l'onglet de contenu affiché, pour ne pas hériter de ses filtres
  data: null,
  // Qui prête sa voix. Retenu d'une entrée à l'autre : on enregistre une
  // série de mots avec la même personne, pas un mot avec dix personnes.
  locuteur: localStorage.getItem('tama-locuteur') || '',
}

/* ------------------------------------------------------------------ */
/* Petits outils partagés                                              */
/* ------------------------------------------------------------------ */

let motTuile = null
function signaler(texte, ok = false) {
  motTuile?.remove()
  motTuile = el(
    'div',
    {
      style:
        'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;' +
        'padding:10px 18px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;' +
        'max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.18);' +
        `background:${ok ? 'var(--vert)' : 'var(--coral)'}`,
    },
    texte,
  )
  document.body.append(motTuile)
  const n = motTuile
  setTimeout(() => n.remove(), 4200)
}

function selecteur(valeur, options, onChange, titre) {
  const s = el('select', { title: titre || '', onchange: (e) => onChange(e.target.value) })
  for (const [v, label] of options) {
    s.append(el('option', { value: v, selected: v === valeur || undefined }, label))
  }
  return s
}

const optionsLangues = [['', 'Toutes les langues'], ...Object.entries(LANGUES)]

const pastille = (statut) => el('span', { class: `puce ${statut}` }, STATUTS[statut] || statut)

/**
 * Où en est cette entrée VIS-À-VIS DES ÉLÈVES — la question que le statut ne
 * répond pas. « Validé » dit qu'un locuteur a tranché ; « en ligne » dit que
 * sa décision est arrivée jusqu'aux téléphones. Les deux se confondaient, et
 * c'est précisément la confusion qui laissait un mot corrigé rester faux.
 */
function pastillePublication(e) {
  if (e.a_jour) return el('span', { class: 'puce valide', title: `Publié le ${new Date(e.publie_le).toLocaleString('fr-FR')}` }, 'en ligne')
  if (e.publie_le)
    return el('span', { class: 'puce a-revoir', title: 'La version en ligne date d’avant cette correction.' }, 'à republier')
  if (e.statut === 'valide' || e.statut === 'rejete')
    return el('span', { class: 'puce a-revoir', title: 'Validé, mais jamais publié — les élèves ne l’ont pas.' }, 'à publier')
  return el('span', { class: 'puce a-valider', title: 'Ni validé ni publié.' }, 'atelier')
}

/** La liste affichée : filtres serveur déjà appliqués, recherche en local. */
function visibles() {
  const q = LEX.q.trim().toLowerCase()
  const tout = LEX.data?.entrees || []
  if (!q) return tout
  return tout.filter((e) =>
    `${e.terme} ${e.sens || ''} ${e.notes || ''} ${e.cle || ''}`.toLowerCase().includes(q),
  )
}

/**
 * Chaque onglet ouvre sur SA tâche : « à enregistrer » sur ce qui manque,
 * « à valider » sur ce que personne n'a relu, le dictionnaire sur tout.
 * Ces réglages-là ne se transmettent donc pas d'un onglet à l'autre — sinon
 * le dictionnaire s'ouvrirait mystérieusement amputé. La LANGUE et la
 * RECHERCHE, elles, suivent : on travaille sur un cours à la fois.
 */
function ouvrir(nom, defauts) {
  if (LEX.vue !== nom) Object.assign(LEX, { statut: '', manque: '' }, defauts)
  LEX.vue = nom
}

async function chargerLexique(extra) {
  LEX.data = await api('lexique', {
    params: {
      lang: LEX.lang,
      statut: LEX.statut,
      categorie: LEX.categorie,
      manque: LEX.manque,
      ...extra,
    },
  })
  return LEX.data
}

/**
 * La barre de filtres. `refaire` recharge depuis le serveur (les filtres qui
 * changent la SÉLECTION) ; `redessiner` ne réécrit que la liste (la
 * recherche, purement locale — sinon chaque frappe perdrait le curseur).
 */
function filtres({ champs, refaire, redessiner, apres }) {
  const barre = el('div', { class: 'filtres' })
  const mis = new Set(champs)

  if (mis.has('lang'))
    barre.append(selecteur(LEX.lang, optionsLangues, (v) => ((LEX.lang = v), refaire())))

  if (mis.has('statut'))
    barre.append(
      selecteur(
        LEX.statut,
        [['', 'Tous les statuts'], ...Object.entries(STATUTS)],
        (v) => ((LEX.statut = v), refaire()),
      ),
    )

  if (mis.has('categorie'))
    barre.append(
      selecteur(
        LEX.categorie,
        [['', 'Mots et expressions'], ...Object.entries(CATEGORIES).map(([k, v]) => [k, `${v}s`])],
        (v) => ((LEX.categorie = v), refaire()),
      ),
    )

  if (mis.has('manque'))
    barre.append(
      selecteur(
        LEX.manque,
        [
          ['', 'Toutes les entrées'],
          ['toute', 'Où il manque une voix'],
          ...VOIX.map((v) => [v.id, `Sans voix ${v.label.toLowerCase()}`]),
        ],
        (v) => ((LEX.manque = v), refaire()),
        'Ne montrer que ce qui reste à enregistrer',
      ),
    )

  const cherche = el('input', {
    type: 'search',
    placeholder: 'Chercher un mot, un sens…',
    value: LEX.q,
    oninput: (e) => {
      LEX.q = e.target.value
      redessiner()
    },
  })
  barre.append(cherche)

  if (apres) barre.append(...apres)
  barre.append(
    el('span', { class: 'pousse' }),
    el('button', { class: 'bouton', onclick: refaire }, '↻ Rafraîchir'),
  )
  return barre
}

/* ------------------------------------------------------------------ */
/* Le son — écouter, enregistrer, déposer                              */
/* ------------------------------------------------------------------ */

let lecture = null
function jouer(url) {
  lecture?.pause()
  lecture = new Audio(url)
  lecture.play().catch(() => signaler('Lecture impossible.'))
}

const enBase64 = (blob) =>
  new Promise((resolve, reject) => {
    const r = new FileReader()
    r.onload = () => resolve(String(r.result).split(',')[1] || '')
    r.onerror = () => reject(r.error)
    r.readAsDataURL(blob)
  })

/** Safari ne connaît pas webm — même négociation que src/lib/speakerVoice.js. */
const FORMATS = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac']
const formatDispo = () => {
  if (typeof MediaRecorder === 'undefined') return null
  return FORMATS.find((t) => {
    try {
      return MediaRecorder.isTypeSupported(t)
    } catch {
      return false
    }
  })
}
const peutEnregistrer = () =>
  !!navigator.mediaDevices?.getUserMedia && typeof MediaRecorder !== 'undefined' && !!formatDispo()

/** Une seule prise à la fois : deux micros ouverts ne servent personne. */
let prise = null

async function demarrerPrise() {
  const type = formatDispo()
  const flux = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
  })
  const rec = new MediaRecorder(flux, { mimeType: type })
  const morceaux = []
  rec.ondataavailable = (e) => e.data?.size && morceaux.push(e.data)
  rec.start(200)
  const fini = new Promise((resolve) => {
    rec.onstop = () => {
      flux.getTracks().forEach((t) => t.stop())
      resolve(new Blob(morceaux, { type }))
    }
  })
  return {
    type,
    arreter: () => {
      if (rec.state === 'recording') rec.stop()
      return fini
    },
  }
}

/**
 * Une case de voix : soit la prise existe (on l'écoute, on la télécharge, on
 * l'efface), soit elle manque (on enregistre au micro, ou on dépose le vocal
 * reçu par messagerie — c'est ainsi que sont arrivés les 24 mp3 kabyles).
 */
function celluleVoix(e, voixId, quandChange) {
  const n = el('div', { class: 'voixcell' })
  const laPrise = () => (e.voix || []).find((v) => v.voix === voixId) || null

  const poser = async (b64, type) => {
    await ecrire('voix', 'POST', {
      id: e.id,
      voix: voixId,
      audio: b64,
      type,
      locuteur: LEX.locuteur,
    })
    e.voix = [
      ...(e.voix || []).filter((v) => v.voix !== voixId),
      { voix: voixId, locuteur: LEX.locuteur, type, at: new Date().toISOString() },
    ]
    rendre()
    quandChange?.()
  }

  const deposerFichier = async (fichier) => {
    if (!fichier) return
    if (fichier.size > TAILLE_MAX)
      return signaler(
        `Fichier trop lourd (${Math.round(fichier.size / 1024)} Ko) — quelques secondes suffisent.`,
      )
    const ext = (fichier.name.split('.').pop() || '').toLowerCase()
    const type = EXT[fichier.type] ? fichier.type : TYPE_PAR_EXT[ext]
    if (!type) return signaler(`Format inconnu (${fichier.type || ext || '?'}).`)
    try {
      await poser(await enBase64(fichier), type)
      signaler(`« ${e.terme} » — voix ${voixId} déposée.`, true)
    } catch (err) {
      signaler(err.message)
    }
  }

  const basculerMicro = async (bouton) => {
    // Une prise en cours ailleurs se termine d'abord : le micro est unique.
    if (prise && prise.cellule !== n) {
      await prise.arreter().catch(() => {})
      prise = null
    }
    if (prise) {
      const p = prise
      prise = null
      bouton.classList.remove('rec')
      bouton.textContent = '…'
      try {
        const blob = await p.arreter()
        if (blob.size > TAILLE_MAX) return signaler('Prise trop longue — recommence plus court.')
        await poser(await enBase64(blob), p.type)
        signaler(`« ${e.terme} » — voix ${voixId} enregistrée.`, true)
      } catch (err) {
        signaler(err.message)
        rendre()
      }
      return
    }
    try {
      prise = { ...(await demarrerPrise()), cellule: n }
      bouton.classList.add('rec')
      bouton.textContent = '⏹'
    } catch {
      signaler('Micro refusé — autorise-le dans le navigateur.')
    }
  }

  const effacer = async () => {
    if (!confirm(`Effacer la voix ${voixId} de « ${e.terme} » ?`)) return
    try {
      await api('voix', { method: 'DELETE', params: { id: e.id, voix: voixId } })
      e.voix = (e.voix || []).filter((v) => v.voix !== voixId)
      rendre()
      quandChange?.()
    } catch (err) {
      signaler(err.message)
    }
  }

  function rendre() {
    n.textContent = ''
    const a = laPrise()
    if (a) {
      const url = adresse('voix', { id: e.id, voix: voixId })
      n.append(
        el(
          'button',
          {
            class: 'mini plein',
            title: `Écouter — ${a.locuteur || 'locuteur non nommé'}`,
            onclick: () => jouer(url),
          },
          '▶',
        ),
        el(
          'a',
          {
            class: 'mini',
            href: url,
            download: `${e.slug || 'audio'}-${voixId}.${EXT[a.type] || 'webm'}`,
            title: 'Télécharger le fichier',
          },
          '⬇',
        ),
        el('button', { class: 'mini', title: 'Effacer cette prise', onclick: effacer }, '✕'),
      )
      return
    }
    const micro = el(
      'button',
      {
        class: 'mini',
        disabled: !peutEnregistrer() || undefined,
        title: peutEnregistrer() ? 'Enregistrer au micro' : 'Micro indisponible sur ce navigateur',
      },
      '🎙',
    )
    micro.addEventListener('click', () => basculerMicro(micro))
    const fichier = el('input', {
      type: 'file',
      accept: 'audio/*',
      onchange: (ev) => {
        deposerFichier(ev.target.files?.[0])
        ev.target.value = ''
      },
    })
    n.append(micro, el('label', { class: 'mini', title: 'Déposer un fichier reçu' }, '⬆', fichier))
  }

  rendre()
  return n
}

/**
 * Les quatre voix en RACCOURCI — quatre pastilles nommées, lisibles d'un
 * coup d'œil. La grille du dictionnaire compte déjà sept colonnes
 * modifiables : y loger seize boutons de micro rendrait la colonne muette,
 * chaque bouton étant indiscernable du voisin. On y montre donc l'état, et
 * l'enregistrement se fait dans l'onglet qui porte son nom.
 */
function resumeVoix(e) {
  const n = el('div', { class: 'voixcell' })
  for (const v of VOIX) {
    const a = (e.voix || []).find((x) => x.voix === v.id)
    n.append(
      a
        ? el('button', {
            class: 'mini plein',
            title: `${v.label} — ${a.locuteur || 'locuteur non nommé'} · écouter`,
            onclick: () => jouer(adresse('voix', { id: e.id, voix: v.id })),
          }, v.court)
        : el('span', { class: 'mini', title: `${v.label} — à enregistrer (onglet Enregistrements)` }, v.court),
    )
  }
  return n
}

/* ------------------------------------------------------------------ */
/* Modifier une entrée — l'écriture partagée par les trois vues        */
/* ------------------------------------------------------------------ */

/**
 * Enregistre une correction. Le serveur ne modifie que les champs envoyés :
 * on n'envoie donc que ce qui a bougé, et un champ vidé (chaîne vide) EFFACE
 * — sans quoi une note posée par erreur ne se retirerait jamais.
 */
async function corriger(e, champs, noeud) {
  try {
    const { entree } = await ecrire('lexique', 'PATCH', { id: e.id, ...champs })
    Object.assign(e, entree)
    if (noeud) {
      noeud.classList.remove('enregistre')
      void noeud.offsetWidth // relance l'animation même sur deux saisies de suite
      noeud.classList.add('enregistre')
    }
    return true
  } catch (err) {
    signaler(err.message)
    return false
  }
}

/* ------------------------------------------------------------------ */
/* Vue « Enregistrements » — ce qu'il reste à dire, voix par voix       */
/* ------------------------------------------------------------------ */

async function vueEnregistrements() {
  // On montre ce qui MANQUE : c'est une liste de travail, pas un catalogue.
  ouvrir('enregistrements', { manque: 'toute' })
  await chargerLexique()

  const bloc = el('div', {})
  const liste = el('div', {})

  const nomLocuteur = el('input', {
    type: 'text',
    placeholder: 'Qui prête sa voix (facultatif)',
    value: LEX.locuteur,
    title: 'Attribué à chaque prise déposée — jamais un pistage, une signature.',
    oninput: (e) => {
      LEX.locuteur = e.target.value.trim()
      localStorage.setItem('tama-locuteur', LEX.locuteur)
    },
  })

  const refaire = () => afficher('enregistrements')

  function dessiner() {
    const lignes = visibles()
    liste.textContent = ''
    if (!lignes.length) {
      liste.append(
        el('p', { class: 'muet' }, 'Rien ici — tout est enregistré, ou le filtre est trop serré.'),
      )
      return
    }
    liste.append(
      el('div', { class: 'defiler' },
        el('table', {},
          el('thead', {},
            el('tr', {},
              el('th', {}, 'Terme'),
              el('th', {}, 'Français'),
              el('th', {}, 'Unité'),
              ...VOIX.map((v) => el('th', {}, v.label)))),
          el('tbody', {}, lignes.map((e) => {
            const tr = el('tr', {})
            tr.append(
              el('td', { class: 'kab', style: 'font-weight:800' }, e.terme),
              el('td', {}, e.sens || el('span', { class: 'muet' }, '—')),
              el('td', { class: 'muet' }, e.unite || '—'),
              ...VOIX.map((v) => el('td', {}, celluleVoix(e, v.id))),
            )
            return tr
          })))),
    )
  }

  const r = LEX.data.resume || {}
  const total = r.entrees || 0

  bloc.append(
    el('h2', {}, 'Les quatre voix'),
    el('div', { class: 'grille' },
      ...VOIX.map((v) =>
        carte((r.parVoix || {})[v.id] || 0, `Voix ${v.label.toLowerCase()}`, `sur ${nombre(total)}`)),
      carte(r.completes || 0, 'Entrées complètes', 'les quatre voix réunies')),

    el('div', { class: 'note', style: 'margin:10px 0 16px' },
      'Un mot n’est pas dit pareil par une grand-mère et par un enfant, et un enfant qui apprend a ' +
      'besoin d’entendre une voix d’enfant : on collecte les quatre. Enregistre au micro (🎙) ou ' +
      'dépose le vocal reçu (⬆) — c’est ainsi que sont arrivés les 24 enregistrements kabyles ' +
      'actuels. Rien n’est reconstitué ni corrigé : la voix est gardée telle quelle, attribuée, ' +
      'et effaçable. Pour la faire entendre dans l’app, télécharge le fichier (⬇) et range-le ' +
      'dans public/audio/ — le déploiement suivant la joue.'),

    el('h2', {}, 'À enregistrer'),
    filtres({
      champs: ['lang', 'manque', 'categorie'],
      refaire,
      redessiner: dessiner,
      apres: [nomLocuteur],
    }),
    liste,
  )

  dessiner()
  return [bloc]
}

/* ------------------------------------------------------------------ */
/* Vue « À valider » — la relecture par un locuteur natif              */
/* ------------------------------------------------------------------ */

async function vueValidation() {
  ouvrir('validation', { statut: 'a-valider' })
  await chargerLexique()

  const bloc = el('div', {})
  const liste = el('div', {})
  const refaire = () => afficher('validation')

  /** Une entrée en grand : on la lit, on l'écoute, on tranche. */
  function fiche(e) {
    const n = el('div', { class: 'entree' })
    const champ = (cle, label, valeur) => {
      const input = el('input', { type: 'text', value: valeur || '' })
      input.addEventListener('change', () => corriger(e, { [cle]: input.value }, n))
      return el('div', {}, el('label', {}, label), input)
    }

    const trancher = async (statut) => {
      if (await corriger(e, { statut }, n)) {
        e.statut = statut
        // La liste est filtrée sur un statut : une entrée qui change de camp
        // s'en va. On la retire à la main plutôt que de tout recharger — le
        // travail se fait à la chaîne, une recharge par mot serait pénible.
        if (LEX.statut && LEX.statut !== statut) {
          n.style.transition = 'opacity .25s'
          n.style.opacity = '0'
          setTimeout(() => n.remove(), 250)
        } else {
          rendreTete()
        }
      }
    }

    const tete = el('div', { class: 'tete' })
    const rendreTete = () => {
      tete.textContent = ''
      // `append` écrirait « null » en toutes lettres pour une branche vide,
      // là où `el()` sait les ignorer : on filtre avant de poser.
      tete.append(
        ...[
          el('span', { class: 'mot' }, e.terme),
          pastille(e.statut),
          el('span', { class: 'puce ' + (e.source === 'ajout' ? 'ajout' : 'dictionnaire') }, e.source),
          pastillePublication(e),
          el('span', { class: 'muet' }, LANGUES[e.lang] || e.lang),
          e.unite ? el('span', { class: 'muet' }, e.unite) : null,
          e.lecons ? el('span', { class: 'muet' }, `leçons ${e.lecons}`) : null,
          // L'écart entre la forme du cours et la forme retenue : ce qui reste
          // à reporter dans src/data/ pour que l'app dise enfin la bonne chose.
          e.cle && e.cle !== e.terme
            ? el('span', { class: 'puce rejete' }, `dans le cours : ${e.cle}`)
            : null,
          e.valide_par ? el('span', { class: 'muet' }, `par ${e.valide_par}`) : null,
        ].filter(Boolean),
      )
    }
    rendreTete()

    const sons = el('div', { class: 'actions', style: 'margin-top:10px' })
    for (const v of VOIX) {
      sons.append(
        el('span', { class: 'muet', style: 'min-width:88px' }, v.label),
        celluleVoix(e, v.id),
      )
    }

    n.append(
      tete,
      el('div', { class: 'champs' },
        champ('terme', 'Forme retenue', e.terme),
        champ('sens', 'Français', e.sens),
        el('div', { style: 'grid-column:1/-1' },
          el('label', {}, 'Notes — variante régionale, registre, doute'),
          (() => {
            const i = el('input', { type: 'text', value: e.notes || '' })
            i.addEventListener('change', () => corriger(e, { notes: i.value }, n))
            return i
          })())),
      el('div', { class: 'actions' },
        el('button', { class: 'bouton fort', onclick: () => trancher('valide') }, '✓ Valider'),
        el('button', { class: 'bouton', onclick: () => trancher('a-revoir') }, '? À revoir'),
        el('button', { class: 'bouton', onclick: () => trancher('rejete') }, '✕ Rejeter'),
        e.statut !== 'a-valider'
          ? el('button', { class: 'bouton doux', onclick: () => trancher('a-valider') }, '↺ Rouvrir')
          : null),
      el('div', { class: 'muet', style: 'margin-top:12px' }, 'Écouter avant de trancher :'),
      sons,
    )
    return n
  }

  function dessiner() {
    const lignes = visibles()
    liste.textContent = ''
    if (!lignes.length) {
      liste.append(el('p', { class: 'muet' }, 'Rien à relire ici. 🎉'))
      return
    }
    liste.append(...lignes.map(fiche))
  }

  const r = LEX.data.resume || {}
  bloc.append(
    el('h2', {}, 'Où en est la relecture'),
    el('div', { class: 'grille' },
      carte(r.a_valider, 'À valider'),
      carte(r.valides, 'Validées'),
      carte(r.a_revoir, 'À revoir', 'un doute est posé'),
      carte(r.rejetes, 'Rejetées', 'à retirer du cours')),

    el('div', { class: 'note', style: 'margin:10px 0 16px' },
      'Le contenu linguistique de l’app est PROVISOIRE tant qu’un locuteur natif ne l’a pas relu. ' +
      'Valider dit « la forme et le sens sont justes » ; corriger réécrit la forme retenue. ' +
      'Une fois validée, une entrée attend d’être PUBLIÉE : c’est le geste qui la fait sortir ' +
      'jusqu’au dictionnaire en ligne.'),

    await panneauPublication(refaire),

    el('h2', {}, 'Les entrées'),
    filtres({ champs: ['lang', 'statut', 'categorie'], refaire, redessiner: dessiner }),
    liste,
  )

  dessiner()
  return [bloc]
}

/* ------------------------------------------------------------------ */
/* L'ÉTAPE DE PUBLICATION — ce qui fait sortir le travail               */
/*                                                                      */
/* Valider ne suffit pas : tant que la correction dort en base, l'app    */
/* enseigne l'ancienne forme. Publier est un acte délibéré — et on voit  */
/* d'abord, ligne à ligne, ce qui va partir. Aucun envoi à l'aveugle.    */
/* ------------------------------------------------------------------ */

async function panneauPublication(refaire) {
  const bloc = el('div', { class: 'encart' })

  const rendre = async () => {
    bloc.textContent = ''
    let d
    try {
      d = await api('publier')
    } catch (e) {
      bloc.append(el('p', { class: 'muet' }, `Publication indisponible — ${e.message}`))
      return
    }
    const attente = d.attente || []
    const enLigne = d.enLigne || {}

    const entete = el('div',
      { style: 'display:flex;align-items:center;gap:12px;flex-wrap:wrap' },
      el('div', {},
        el('div', { style: 'font-size:15px;font-weight:800' },
          attente.length
            ? `${nombre(attente.length)} correction(s) prêtes à publier`
            : 'Tout ce qui est validé est en ligne.'),
        el('div', { class: 'note', style: 'margin-top:2px' },
          enLigne.derniere
            ? `${nombre(enLigne.total)} entrée(s) en ligne, dont ${nombre(enLigne.retires)} retirée(s) — ` +
              `dernière publication le ${new Date(enLigne.derniere).toLocaleString('fr-FR')}.`
            : 'Rien n’a encore été publié : le dictionnaire en ligne montre le contenu du dernier déploiement.')),
      el('span', { class: 'pousse', style: 'margin-left:auto' }),
      attente.length
        ? el('button', {
            class: 'bouton fort',
            onclick: async (ev) => {
              const b = ev.target
              b.disabled = true
              b.textContent = 'Publication…'
              try {
                const res = await ecrire('publier', 'POST', {})
                signaler(`${res.publiees} correction(s) publiées — en ligne d’ici quelques minutes.`, true)
                refaire()
              } catch (err) {
                signaler(err.message)
                b.disabled = false
                b.textContent = '↑ Publier'
              }
            },
          }, '↑ Publier')
        : null,
    )
    bloc.append(entete)

    if (!attente.length) return

    // Ce qui va partir, ligne à ligne. La colonne « en ligne » montre ce que
    // les élèves voient AUJOURD'HUI : sans elle, publier serait un pari.
    bloc.append(
      el('div', { class: 'defiler', style: 'margin-top:12px' },
        el('table', {},
          el('thead', {},
            el('tr', {},
              el('th', {}, 'Langue'),
              el('th', {}, 'Ce qui partira'),
              el('th', {}, 'Français'),
              el('th', {}, 'En ligne aujourd’hui'),
              el('th', {}, 'Geste'))),
          el('tbody', {}, attente.map((e) =>
            el('tr', {},
              el('td', { class: 'muet' }, LANGUES[e.lang] || e.lang),
              el('td', { style: 'font-weight:800' },
                e.statut === 'rejete' ? el('s', {}, e.terme) : e.terme),
              el('td', {}, e.sens || el('span', { class: 'muet' }, '—')),
              el('td', { class: 'muet' },
                !e.publie_le
                  ? el('span', { class: 'puce a-valider' }, e.cle ? 'contenu embarqué' : 'absente')
                  : `${e.publie_terme}${e.publie_sens ? ` — ${e.publie_sens}` : ''}`),
              el('td', {},
                el('span', { class: `puce ${e.statut === 'rejete' ? 'rejete' : 'valide'}` },
                  e.statut === 'rejete'
                    ? 'retrait'
                    : !e.publie_le
                      ? (e.cle ? 'correction' : 'ajout')
                      : 'mise à jour'))))))),
      el('div', { class: 'note' },
        'Publier pose une COUCHE par-dessus le contenu embarqué de l’app : le dictionnaire en ligne ' +
        'montre la forme relue en quelques minutes, sans déploiement. Les LEÇONS ne bougent pas — ' +
        'un exercice dont la bonne réponse changerait sous les pieds de l’élève casserait sa série. ' +
        'Pour corriger le cours lui-même, il faut toujours reporter dans src/data/.'),
    )
  }

  await rendre()
  return bloc
}

/* ------------------------------------------------------------------ */
/* Vue « Dictionnaire » — tout le contenu, et tout modifiable          */
/* ------------------------------------------------------------------ */

async function vueDictionnaire() {
  ouvrir('dictionnaire')
  await chargerLexique()

  const bloc = el('div', {})
  const liste = el('div', {})
  const refaire = () => afficher('dictionnaire')

  /* --- Ajouter une entrée qui n'est dans aucune leçon --- */
  const ajout = el('div', { class: 'encart', style: 'display:none' })
  const champsAjout = {}
  const champAjout = (cle, placeholder, large) => {
    champsAjout[cle] = el('input', {
      type: 'text',
      placeholder,
      style: `font-family:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);
              border-radius:9px;background:var(--sand);color:var(--ink);${large ? 'flex:1' : ''}`,
    })
    return champsAjout[cle]
  }
  const langAjout = selecteur(LEX.lang || 'kab', Object.entries(LANGUES), () => {})
  ajout.append(
    el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' },
      langAjout,
      champAjout('terme', 'Le mot ou l’expression', true),
      champAjout('sens', 'Ce que ça veut dire', true)),
    el('div', { style: 'display:flex;gap:8px;margin-top:8px;align-items:center' },
      champAjout('notes', 'Notes (source, variante, registre)', true),
      el('button', {
        class: 'bouton fort',
        onclick: async () => {
          const terme = champsAjout.terme.value.trim()
          if (!terme) return signaler('Il faut au moins un mot.')
          try {
            await ecrire('lexique', 'POST', {
              lang: langAjout.value,
              terme,
              sens: champsAjout.sens.value.trim(),
              notes: champsAjout.notes.value.trim(),
            })
            signaler(`« ${terme} » ajouté au dictionnaire.`, true)
            refaire()
          } catch (err) {
            signaler(err.message)
          }
        },
      }, 'Ajouter')),
    el('div', { class: 'note' },
      'Une entrée ajoutée ici n’est dans aucune leçon : elle sert à préparer du contenu, ' +
      'ou à garder un mot rapporté par un locuteur. Elle est la seule qu’on puisse supprimer — ' +
      'un mot venu d’une leçon reviendrait au chargement suivant, il se marque « rejeté ».'),
  )

  const boutonAjout = el('button', {
    class: 'bouton',
    onclick: () => {
      ajout.style.display = ajout.style.display === 'none' ? 'block' : 'none'
    },
  }, '+ Ajouter')

  const exportCsv = el('a', {
    class: 'bouton',
    href: adresse('lexique', {
      lang: LEX.lang, statut: LEX.statut, categorie: LEX.categorie, manque: LEX.manque, format: 'csv',
    }),
    title: 'La sélection courante, en tableur — la fiche qu’on envoie à un relecteur',
  }, '⬇ CSV')

  /** Une ligne entièrement modifiable : chaque champ s'enregistre en le quittant. */
  function ligne(e) {
    const tr = el('tr', { class: e.statut === 'rejete' ? 'rejete' : undefined })

    const texte = (cle, valeur, gras) => {
      const i = el('input', { type: 'text', value: valeur || '' })
      i.addEventListener('change', async () => {
        if (await corriger(e, { [cle]: i.value }, tr)) i.value = e[cle] || ''
      })
      return el('td', { class: gras ? 'kab' : undefined }, i)
    }

    const statut = selecteur(e.statut, Object.entries(STATUTS), async (v) => {
      if (await corriger(e, { statut: v }, tr)) tr.classList.toggle('rejete', v === 'rejete')
    })

    const categorie = selecteur(e.categorie, Object.entries(CATEGORIES), (v) =>
      corriger(e, { categorie: v }, tr),
    )

    const supprimer = el('button', {
      class: 'mini',
      title:
        e.source === 'ajout'
          ? 'Supprimer cette entrée'
          : 'Impossible : ce mot est dans une leçon. Marque-le « rejeté ».',
      disabled: e.source !== 'ajout' || undefined,
      onclick: async () => {
        if (!confirm(`Supprimer « ${e.terme} » du dictionnaire ?`)) return
        try {
          await api('lexique', { method: 'DELETE', params: { id: e.id } })
          tr.remove()
        } catch (err) {
          signaler(err.message)
        }
      },
    }, '🗑')

    tr.append(
      el('td', { class: 'muet' }, LANGUES[e.lang] || e.lang),
      texte('terme', e.terme, true),
      // La forme du cours, en clair quand elle diffère : c'est la liste des
      // corrections qu'il reste à reporter dans src/data/.
      el('td', { class: 'muet' },
        !e.cle
          ? el('span', { class: 'puce ajout' }, 'ajout')
          : e.cle === e.terme
            ? '—'
            : el('span', { class: 'puce rejete' }, e.cle)),
      texte('sens', e.sens),
      texte('notes', e.notes),
      el('td', { class: 'muet' }, e.unite || '—'),
      el('td', { style: 'min-width:118px' }, categorie),
      el('td', { style: 'min-width:118px' }, statut),
      el('td', {}, pastillePublication(e)),
      el('td', {}, resumeVoix(e)),
      el('td', { class: 'actions' }, supprimer),
    )
    return tr
  }

  function dessiner() {
    const lignes = visibles()
    liste.textContent = ''
    liste.append(
      el('div', { class: 'note', style: 'margin-bottom:8px' },
        `${nombre(lignes.length)} entrée(s) affichée(s). Chaque champ s’enregistre en le quittant.`),
    )
    if (!lignes.length) {
      liste.append(el('p', { class: 'muet' }, 'Rien ne correspond.'))
      return
    }
    liste.append(
      el('div', { class: 'defiler' },
        el('table', {},
          el('thead', {},
            el('tr', {},
              el('th', {}, 'Langue'),
              el('th', {}, 'Terme retenu'),
              el('th', {}, 'Du cours'),
              el('th', {}, 'Français'),
              el('th', {}, 'Notes'),
              el('th', {}, 'Unité'),
              el('th', {}, 'Type'),
              el('th', {}, 'Statut'),
              el('th', { title: 'Ce que les élèves ont réellement sous les yeux' }, 'En ligne'),
              el('th', { title: 'Femme · Homme · enfant Fille · enfant Garçon' }, 'Voix'),
              el('th', {}, ''))),
          el('tbody', {}, lignes.map(ligne)))),
    )
  }

  const r = LEX.data.resume || {}
  bloc.append(
    el('h2', {}, 'Le dictionnaire'),
    el('div', { class: 'grille' },
      carte(r.entrees, 'Entrées'),
      carte(r.valides, 'Validées'),
      carte(r.publiees, 'En ligne', 'vues par les élèves'),
      carte(r.a_publier, 'À publier', 'validées, pas encore sorties'),
      carte(r.completes, 'Enregistrées', 'les quatre voix')),

    el('div', { class: 'note', style: 'margin:10px 0 16px' },
      LEX.data.semeDepuis === 'dictionnaire'
        ? 'Contenu tiré de src/data/dictionnaire.js — la base cherchable des cinq cours.'
        : 'Contenu tiré du vocabulaire des cours (src/data/courses/*.js). Le dictionnaire ' +
          'n’est pas encore présent : dès qu’il arrivera, il prendra le relais tout seul.'),

    el('div', { class: 'avert' },
      'Ce qu’on corrige ici ne descend PAS tout seul dans les téléphones. L’app embarque son ' +
      'contenu depuis src/data/ — c’est ce qui la rend hors-ligne. Cet écran est l’atelier : ' +
      'on y relit, on y enregistre, puis on reporte les corrections dans les fichiers du cours. ' +
      'La colonne « du cours » liste précisément ce qui reste à reporter.'),

    filtres({
      champs: ['lang', 'statut', 'categorie', 'manque'],
      refaire,
      redessiner: dessiner,
      apres: [boutonAjout, exportCsv],
    }),
    ajout,
    liste,
  )

  dessiner()
  return [bloc]
}

/* ------------------------------------------------------------------ */
/* Aiguillage                                                           */
/* ------------------------------------------------------------------ */

const VUES = {
  usage: vueUsage,
  abonnements: vueAbonnements,
  retours: vueRetours,
  enregistrements: vueEnregistrements,
  validation: vueValidation,
  dictionnaire: vueDictionnaire,
}

/** Les vues de contenu ont besoin de largeur ; les chiffres se lisent serrés. */
const LARGES = new Set(['enregistrements', 'validation', 'dictionnaire'])

let vueCourante = 'usage'

async function afficher(nom) {
  for (const b of document.querySelectorAll('#onglets button')) {
    b.setAttribute('aria-selected', String(b.dataset.vue === nom))
  }
  vueCourante = nom
  document.querySelector('.wrap').classList.toggle('large', LARGES.has(nom))
  // Changer d'onglet en pleine prise couperait le micro sans rien en faire.
  prise?.arreter().catch(() => {})
  prise = null
  vue.textContent = ''
  vue.append(el('div', { class: 'message' }, '· · ·'))
  try {
    const contenu = await VUES[nom]()
    vue.textContent = ''
    vue.append(...contenu.flat().filter(Boolean))
    document.getElementById('sous').textContent =
      `Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`
  } catch (e) {
    vue.textContent = ''
    // Chaque refus dit ce qu'il faut FAIRE : un « 403 » nu n'aide personne.
    vue.append(el('div', { class: 'message' },
      e.message === '403'
        ? el('span', {}, el('b', {}, 'Accès refusé.'), ' ',
            'Connecte-toi à Tama Speak avec un email figurant dans la variable ADMIN_EMAILS, ',
            'puis recharge cette page.')
        : e.message === '503'
          ? el('span', {}, el('b', {}, 'Base de données non configurée.'), ' ',
              'DATABASE_URL n’est pas renseignée : l’app tourne en mode local, il n’y a rien à mesurer.')
          : el('span', {}, el('b', {}, 'Le serveur n’a pas répondu.'), ' Réessaie dans un instant.')))
  }
}

document.getElementById('onglets').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-vue]')
  if (b) afficher(b.dataset.vue)
})

afficher('usage')
</script>
