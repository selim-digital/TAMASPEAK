<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nuit étoilée sur le Tassili n'Ajjer : arche de grès, cheminées de pierre et croissant de lune">
  <defs>
    <linearGradient id="tassili-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17202F"/>
      <stop offset="1" stop-color="#1F5AA8"/>
    </linearGradient>
    <mask id="tassili-moon">
      <circle cx="58" cy="40" r="13" fill="#fff"/>
      <circle cx="63" cy="36" r="11" fill="#000"/>
    </mask>
  </defs>

  <!-- ciel -->
  <rect x="0" y="0" width="320" height="200" fill="url(#tassili-sky)"/>

  <!-- croissant de lune -->
  <circle cx="58" cy="40" r="13" fill="#FFFAF1" mask="url(#tassili-moon)"/>

  <!-- etoiles rondes -->
  <circle cx="96" cy="28" r="1.3" fill="#E3E9EF" fill-opacity="0.9"/>
  <circle cx="140" cy="52" r="1.1" fill="#E3E9EF" fill-opacity="0.8"/>
  <circle cx="178" cy="24" r="1.5" fill="#E3E9EF"/>
  <circle cx="222" cy="44" r="1.2" fill="#E3E9EF" fill-opacity="0.85"/>
  <circle cx="287" cy="30" r="1.4" fill="#E3E9EF" fill-opacity="0.95"/>

  <!-- plateaux tres lointains -->
  <path fill="#A6B9D3" d="M0,200 L0,104 L34,104 L38,97 L70,97 L74,102 L118,102 L122,98 L158,98 L162,103 L206,103 L210,112 L258,112 L262,104 L292,104 L296,100 L320,100 L320,200 Z"/>

  <!-- plateaux lointains -->
  <path fill="#8CA6C8" d="M0,200 L0,108 L26,108 L30,100 L58,100 L62,106 L96,106 L100,112 L138,112 L142,104 L168,104 L172,110 L206,110 L210,116 L252,116 L256,118 L288,118 L292,112 L320,112 L320,200 Z"/>

  <!-- couche mediane : cheminees de gres -->
