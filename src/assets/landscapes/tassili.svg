  <path fill="#1E2530" d="M0,200 L0,170 Q30,163 64,166 Q100,169 138,164 Q172,160 208,165 Q246,170 280,166 Q300,163 320,166 L320,200 Z"/>
  <path fill="#283349" d="M0,200 L0,184 Q56,176 128,182 Q198,188 258,180 Q292,176 320,181 L320,200 Z"/>
  <path fill="#2C3750" d="M62,181 L67,170 L73,172 L77,181 Z"/>
  <path fill="#2C3750" d="M240,183 L245,172 L251,171 L256,183 Z"/>
