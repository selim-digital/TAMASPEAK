  <!-- arche de pierre -->
  <path fill="#23375A" fill-rule="evenodd" d="M194,178 L198,130 L204,106 L214,92 L228,84 L246,84 L260,90 L270,102 L276,122 L280,150 L282,178 Z M212,178 L214,142 Q216,114 226,106 Q237,100 248,107 Q259,114 260,142 L262,178 Z"/>
  <path fill="#23375A" d="M286,178 L291,148 L298,138 L305,141 L311,152 L316,149 L320,154 L320,178 Z"/>

