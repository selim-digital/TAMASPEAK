  <path fill="#23375A" d="M118,178 L124,148 L132,142 L140,146 L144,158 L148,178 Z"/>
  <path fill="#23375A" d="M150,178 L154,156 L162,150 L168,153 L172,146 L178,148 L182,160 L186,178 Z"/>

  <!-- detail signature : etoile doree encadree par l'arche -->
